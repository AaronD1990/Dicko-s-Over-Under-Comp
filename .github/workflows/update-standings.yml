name: Update standings

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch standings
        run: python scripts/update_standings.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain data/standings.json)" ]; then
            git config user.name "standings-bot"
            git config user.email "standings-bot@users.noreply.github.com"
            git add data/standings.json
            git commit -m "Update standings"
            git push
          else
            echo "Nothing to commit."
          fi
